<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111817">
<title>Dough Batch Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column for a phone at the prep table.
   Tray counts → where extra dough goes → batch chart (tap a row when it's made). */
:root {
  --bg: #f2f5f4;
  --surface: #ffffff;
  --ink: #18221f;
  --muted: #5d6b67;
  --line: #d9e0de;
  --accent: #2c6a4d;
  --accent-ink: #ffffff;
  --soft: #e3eee8;
  --warn: #8a5100;
  --warn-bg: #fbefd5;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111817; --surface: #19221f; --ink: #e8efec; --muted: #96a6a1; --line: #2b3834;
    --accent: #6fc79a; --accent-ink: #0c1411; --soft: #22342c; --warn: #f0be6a; --warn-bg: #3a2e15;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111817; --surface: #19221f; --ink: #e8efec; --muted: #96a6a1; --line: #2b3834;
  --accent: #6fc79a; --accent-ink: #0c1411; --soft: #22342c; --warn: #f0be6a; --warn-bg: #3a2e15;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.4 var(--body);
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
section { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

h1 { font: 700 2rem/1.05 var(--display); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 0.95rem; }
h2 { font: 600 0.95rem var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.link { font: 600 0.9rem var(--body); color: var(--accent); padding: 4px 2px; }

/* Tray inputs: + / number / − per size */
.inputs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.field { display: flex; flex-direction: column; align-items: stretch; min-width: 0; text-align: center; }
.field label { font: 700 1.35rem/1 var(--display); margin-bottom: 6px; }
.stepper { display: flex; flex-direction: column; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.stepper button { height: 34px; font: 600 1.3rem/1 var(--display); color: var(--muted); }
.stepper button:active { background: var(--soft); color: var(--accent); }
.stepper input {
  width: 100%; min-width: 0; border: 0; border-block: 1px solid var(--line);
  padding: 6px 0; background: none; color: var(--ink);
  font: 700 1.6rem var(--display); text-align: center; font-variant-numeric: tabular-nums;
  -moz-appearance: textfield;
}
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field small { margin-top: 5px; font-size: 0.72rem; color: var(--muted); }

/* Extra dough choice */
.seg { display: grid; grid-template-columns: 1.7fr repeat(5, 1fr); border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.seg button { padding: 9px 0; border-left: 1px solid var(--line); font: 700 1.05rem var(--display); min-width: 0; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.hint { margin: 0; font-size: 0.85rem; color: var(--muted); }

/* Results */
.totals { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.totals b { font: 700 1.2rem var(--display); color: var(--ink); }
.tip { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 0.9rem; }

.chart { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
th, td { text-align: center; padding: 9px 4px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); }
th:first-child, td:first-child { border-left: 0; }
tbody tr:last-child td { border-bottom: 0; }
thead th { font: 700 1.15rem var(--display); background: var(--soft); }
.b { width: 62px; background: var(--soft); }
.b button { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; font: 700 1.35rem/1 var(--display); }
.check { width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 5px; display: grid; place-items: center; font-size: 0.75rem; color: transparent; }
.tag { padding: 1px 6px; border-radius: 99px; font: 600 0.64rem var(--body); background: var(--warn-bg); color: var(--warn); }
td .n { display: block; font: 700 1.55rem/1.05 var(--display); }
td .s { display: block; margin-top: 2px; font-size: 0.7rem; line-height: 1.2; color: var(--muted); }
td.letter .n { color: var(--accent); }
td.none .n { color: var(--line); font-weight: 500; }
tr.done td:not(.b) { opacity: 0.35; }
tr.done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
tr.total td { background: var(--soft); }
tr.total .b { font: 700 0.95rem var(--display); }
td .s.plus { color: var(--accent); font-weight: 600; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.legend { margin: 0; font-size: 0.85rem; color: var(--muted); }
.legend b { font: 700 1.05rem var(--display); color: var(--accent); }
</style>
</head>
<body>

<main>
  <header>
    <h1>Dough Batch Planner</h1>
    <p class="sub">Each batch is one 1,216 oz dough ball. Partial trays round up.</p>
  </header>

  <section aria-labelledby="h-in">
    <div class="row"><h2 id="h-in">Trays needed</h2><button class="link" id="clear" type="button">Clear</button></div>
    <div class="inputs" id="inputs"></div>
  </section>

  <section aria-labelledby="h-ex">
    <h2 id="h-ex">Extra dough goes to</h2>
    <div class="seg" id="extra" role="group" aria-labelledby="h-ex"></div>
    <p class="hint" id="hint"></p>
  </section>

  <section aria-labelledby="h-out">
    <div class="row"><h2 id="h-out">Batches</h2><div class="totals" id="totals" aria-live="polite"></div></div>
    <p class="tip" id="tip" hidden></p>
    <div class="chart" id="chart"></div>
    <p class="legend"><b>#</b> trays to cut · <b>R</b> rest of the dough · <b>A</b> whole batch · tap a batch when it's made</p>
  </section>
</main>

<script>
// ===== Planner (pure functions) =====
var CAP = 1216; // oz per batch: 8 trays × 8 larges × 19 oz
var SIZES = [
  { k: "P",  ball: 5,  per: 12 },
  { k: "S",  ball: 10, per: 10 },
  { k: "M",  ball: 14, per: 9 },
  { k: "L",  ball: 19, per: 8 },
  { k: "XL", ball: 25, per: 6 }
];
var BY = {};
SIZES.forEach(function (s) { s.tray = s.ball * s.per; BY[s.k] = s; });
var KEYS = SIZES.map(function (s) { return s.k; });

function ozOf(t) { return KEYS.reduce(function (sum, k) { return sum + (t[k] || 0) * BY[k].tray; }, 0); }
function cmp(a, b) { for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; }
function perms(a) {
  if (a.length < 2) return [a.slice()];
  return a.reduce(function (out, x, i) {
    return out.concat(perms(a.slice(0, i).concat(a.slice(i + 1))).map(function (p) { return [x].concat(p); }));
  }, []);
}

// A bin is one batch, counted in dough balls. The last size added is its R.
function bin() { return { balls: {}, order: [], used: 0 }; }
function put(b, k, n) {
  if (!b.balls[k]) { b.balls[k] = 0; b.order.push(k); }
  b.balls[k] += n;
  b.used += n * BY[k].ball;
}

// Tidy fill: one size at a time, so sizes stay together.
// step = whole trays, or single balls (lets one tray finish in the next batch).
function fillInOrder(t, order, byBall) {
  var bins = [], cur = null;
  order.forEach(function (k) {
    var s = BY[k], step = byBall ? 1 : s.per, left = t[k] * s.per;
    while (left > 0) {
      var fit = cur ? Math.floor((CAP - cur.used) / (step * s.ball)) * step : 0;
      if (!fit) { cur = bin(); bins.push(cur); continue; }
      var n = Math.min(left, fit);
      put(cur, k, n);
      left -= n;
    }
  });
  return bins;
}

// Tight fill: biggest trays first, each into the fullest batch it still fits.
function fillTight(t, B) {
  var bins = [];
  for (var i = 0; i < B; i++) bins.push(bin());
  var bySize = SIZES.slice().sort(function (a, b) { return b.tray - a.tray; });
  for (var i = 0; i < bySize.length; i++) {
    var s = bySize[i];
    for (var n = 0; n < t[s.k]; n++) {
      var pick = null;
      bins.forEach(function (b) { if (b.used + s.tray <= CAP && (!pick || b.used > pick.used)) pick = b; });
      if (!pick) return null;
      put(pick, s.k, s.per);
    }
  }
  return bins.filter(function (b) { return b.order.length; });
}

// Of all fill orders that fit in B batches: fewest mixed, then fewest sizes per mix,
// then the chosen extra size last (so the final leftover lands on it).
function bestInOrder(t, B, extraTo, byBall) {
  var best = null;
  perms(KEYS.slice().reverse().filter(function (k) { return t[k] > 0; })).forEach(function (order) {
    var bins = fillInOrder(t, order, byBall);
    if (bins.length > B) return;
    var mixed = bins.filter(function (b) { return b.order.length > 1; });
    var score = [
      mixed.length,
      mixed.reduce(function (n, b) { return n + b.order.length; }, 0),
      order[order.length - 1] === extraTo ? 0 : 1
    ];
    if (!best || cmp(score, best.score) < 0) best = { score: score, bins: bins };
  });
  return best && best.bins;
}

// Trays to aim for with B batches: spare dough shared by need, or all to one size.
function targets(counts, B, extraTo) {
  var need = ozOf(counts), spare = B * CAP - need, t = {};
  KEYS.forEach(function (k) {
    var s = BY[k];
    t[k] = counts[k];
    if (extraTo === "spread") t[k] += Math.floor(spare * (counts[k] * s.tray) / need / s.tray);
    else if (extraTo === k) t[k] += Math.floor(spare / s.tray);
  });
  return t;
}

// Fewest batches first. Never fewer trays than asked for.
function plan(counts, extraTo) {
  var need = ozOf(counts);
  if (!need) return [];
  var packers = [
    function (t, B) { return bestInOrder(t, B, extraTo, false); },
    fillTight
  ];
  for (var B = Math.ceil(need / CAP); ; B++) {
    for (var p = 0; p < packers.length; p++) {
      var t = targets(counts, B, extraTo);
      for (;;) {
        var bins = packers[p](t, B);
        if (bins) return finish(bins);
        // Too much: give back one extra tray from the size with the most extra.
        var drop = null, most = 0;
        KEYS.forEach(function (k) {
          var ex = (t[k] - counts[k]) * BY[k].tray;
          if (ex > most) { most = ex; drop = k; }
        });
        if (!drop) break;
        t[drop]--;
      }
    }
    var tight = bestInOrder(counts, B, extraTo, true);
    if (tight) return finish(tight);
  }
}

// Turn bins into chart rows. Mixed batches first.
// R goes to the size with the most dough in the batch, so the small amounts stay exact counts.
function finish(bins) {
  return bins.map(function (b) {
    var r = b.order.reduce(function (big, k) {
      return b.balls[k] * BY[k].ball >= b.balls[big] * BY[big].ball ? k : big;
    });
    var rS = BY[r], cells = {};
    var rest = CAP - b.used + b.balls[r] * rS.ball;
    b.order.forEach(function (k) {
      var s = BY[k], n = b.balls[k];
      cells[k] = k === r
        ? { kind: b.order.length > 1 ? "R" : "A", makes: Math.floor(rest / s.ball) / s.per }
        : { kind: "N", trays: Math.floor(n / s.per), balls: n % s.per, makes: n / s.per };
    });
    return { mixed: b.order.length > 1, cells: cells };
  }).sort(function (a, b) { return b.mixed - a.mixed; });
}

// When you're right at a batch line, the fewest trays to drop to save a batch.
function saveTip(counts, extraTo, B) {
  if (B < 2) return null;
  var over = ozOf(counts) - (B - 1) * CAP;
  if (over > 2 * BY.L.tray) return null;
  var best = null;
  KEYS.forEach(function (k) {
    for (var n = 1; n <= Math.min(counts[k], 4); n++) {
      var c = Object.assign({}, counts);
      c[k] -= n;
      if (plan(c, extraTo).length < B) {
        if (!best || n * BY[k].tray < best.oz) best = { k: k, n: n, oz: n * BY[k].tray };
        break;
      }
    }
  });
  return best && { over: over, B: B, k: best.k, n: best.n };
}

// ===== Page =====
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (key, fallback) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
    set: function (key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  };
  var counts = store.get("counts", { P: 2, S: 3, M: 4, L: 10, XL: 3 });
  var extraTo = store.get("extraTo", "spread");
  if (extraTo !== "spread" && !BY[extraTo]) extraTo = "spread";
  var done = {}, planKey = "";

  var trim = function (n) { return String(Math.round(n * 10) / 10); };
  var plural = function (n, word) { return n + " " + word + (n === 1 ? "" : "es"); };

  // Build inputs
  $("inputs").innerHTML = SIZES.map(function (s) {
    return '<div class="field"><label for="in-' + s.k + '">' + s.k + '</label>' +
      '<div class="stepper">' +
        '<button type="button" data-k="' + s.k + '" data-d="1" aria-label="Add a ' + s.k + ' tray">+</button>' +
        '<input id="in-' + s.k + '" type="number" inputmode="numeric" min="0" step="1">' +
        '<button type="button" data-k="' + s.k + '" data-d="-1" aria-label="Remove a ' + s.k + ' tray">−</button>' +
      '</div><small>' + s.per + ' × ' + s.ball + ' oz</small></div>';
  }).join("");
  KEYS.forEach(function (k) { $("in-" + k).value = counts[k] || ""; });

  $("extra").innerHTML = ["spread"].concat(KEYS).map(function (k) {
    return '<button type="button" data-x="' + k + '">' + (k === "spread" ? "Spread" : k) + '</button>';
  }).join("");

  function readInput(k) {
    var v = parseFloat($("in-" + k).value);
    return isFinite(v) && v > 0 ? Math.min(Math.ceil(v), 999) : 0;
  }

  function render() {
    store.set("counts", counts);
    store.set("extraTo", extraTo);

    Array.prototype.forEach.call($("extra").children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.x === extraTo));
    });
    $("hint").textContent = extraTo === "spread"
      ? "Leftover dough is shared across sizes by how much of each you need."
      : "Leftover dough goes to " + extraTo + " wherever possible.";

    var batches = plan(counts, extraTo);
    var key = JSON.stringify([counts, extraTo]);
    if (key !== planKey) { done = {}; planKey = key; }

    var mixed = batches.filter(function (b) { return b.mixed; }).length;
    $("totals").innerHTML = batches.length
      ? '<b>' + batches.length + '</b> batches · <b>' + mixed + '</b> mixed · <b>' + (batches.length * CAP).toLocaleString("en-US") + '</b> oz'
      : "";

    var tip = saveTip(counts, extraTo, batches.length);
    $("tip").hidden = !tip;
    if (tip) {
      var lead = tip.over > 0
        ? "You're only <b>" + tip.over + " oz</b> over " + plural(tip.B - 1, "batch")
        : "This fits " + plural(tip.B - 1, "batch") + " with only <b>" + -tip.over + " oz</b> to spare, too tight to cut cleanly";
      $("tip").innerHTML = lead + ". Drop <b>" + tip.n + " " + tip.k + " tray" + (tip.n === 1 ? "" : "s") + "</b> to save a whole batch.";
    }

    if (!batches.length) {
      $("chart").innerHTML = '<div class="empty">Add tray counts above to plan your batches.</div>';
      return;
    }

    var made = {};
    var dash = '<td class="none"><span class="n">–</span></td>';
    var rows = batches.map(function (b, i) {
      var cells = SIZES.map(function (s) {
        var c = b.cells[s.k];
        if (!c) return dash;
        made[s.k] = (made[s.k] || 0) + c.makes;
        if (c.kind === "N") {
          return '<td><span class="n">' + c.trays + '</span>' + (c.balls ? '<span class="s">+' + c.balls + ' balls</span>' : '') + '</td>';
        }
        return '<td class="letter"><span class="n">' + c.kind + '</span><span class="s">≈' + trim(c.makes) + ' trays</span></td>';
      }).join("");
      return '<tr class="' + (done[i] ? "done" : "") + '"><td class="b">' +
        '<button type="button" data-row="' + i + '" aria-pressed="' + !!done[i] + '" aria-label="Batch ' + (i + 1) + ' made">' +
        (i + 1) + '<span class="check">✓</span>' + (b.mixed ? '<span class="tag">mixed</span>' : '') +
        '</button></td>' + cells + '</tr>';
    }).join("");

    var total = SIZES.map(function (s) {
      var m = Math.floor((made[s.k] || 0) * s.per) / s.per, extra = m - counts[s.k];
      if (!counts[s.k] && !m) return dash;
      return '<td><span class="n">' + counts[s.k] + '</span>' +
        (extra > 0.05 ? '<span class="s plus">+' + trim(extra) + ' extra</span>' : '<span class="s">exact</span>') + '</td>';
    }).join("");

    $("chart").innerHTML = '<table><thead><tr><th class="b">Batch</th>' +
      KEYS.map(function (k) { return '<th>' + k + '</th>'; }).join("") +
      '</tr></thead><tbody>' + rows + '<tr class="total"><td class="b">Total</td>' + total + '</tr></tbody></table>';
  }

  // Events
  $("inputs").addEventListener("input", function (e) {
    var k = e.target.id.slice(3);
    if (BY[k]) { counts[k] = readInput(k); render(); }
  });
  $("inputs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-k]");
    if (!b) return;
    var k = b.dataset.k;
    counts[k] = Math.max(0, (counts[k] || 0) + Number(b.dataset.d));
    $("in-" + k).value = counts[k] || "";
    render();
  });
  $("extra").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-x]");
    if (b) { extraTo = b.dataset.x; render(); }
  });
  $("chart").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-row]");
    if (b) { done[b.dataset.row] = !done[b.dataset.row]; render(); }
  });
  $("clear").addEventListener("click", function () {
    KEYS.forEach(function (k) { counts[k] = 0; $("in-" + k).value = ""; });
    render();
  });

  render();
})();
</script>
</body>
</html>
